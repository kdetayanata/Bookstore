<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Bookshop</title>
    
    <link rel="stylesheet" href="styles.css">

    <style>
        .notice {
            color: darkred;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Timeless Pages Bookstore</h1>
        <p class="notice">Sale: All books $10 today!</p>
    </header>

    <nav>
        <a href="#">Home</a> | <a href="#">Books</a>
    </nav>

    <section>
        <h2>Featured Book</h2>

        <article>
            <h3>Crime and Punishment</h3>
            <img src="dstv_book.png" alt="Crime and Punishment Book Cover" width="120">
            <p>A classic novel by Fyodor Dostoevsky.</p>

            <p style="color: green; font-weight: bold;">$10.00</p>
        </article>
    </section>

    <aside>
        <h3>Hours</h3>
        <p>Open daily 10 AM - 6 PM</p>
    </aside>

    <footer>
        <p>&copy; 2026 Timesless Pages Bookstore</p>
    </footer>

</body>
</html>
