<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Signup - Timeless Pages Bookstore</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">

    <style>
        .notice {
            color: darkred;
            font-weight: bold;
        }
        /* Style for the JSON display output */
        pre {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #dee2e6;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <header>
        <h1>Timeless Pages Bookstore</h1>
        <p class="notice">Sale: All books $10 today!</p>
    </header>

    <nav>
        <a href="index.html">Home</a> | <a href="index.html">Books</a> | <a href="signup.html">Sign Up</a>
    </nav>

    <main class="container my-4">
        <h2 class="mb-4">User Signup</h2>
        
        <!-- Changed onsubmit to handle the event directly -->
        <form style="max-width: 500px;" onsubmit="handleFormSubmit(event)">
            <div class="mb-3">
                <label for="username" class="form-label">Username:</label>
                <input type="text" class="form-control" id="username" placeholder="Enter username" onfocusout="validate(this)">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" placeholder="Enter email" onfocusout="validate(this)">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password:</label>
                <input type="password" class="form-control" id="password" placeholder="Enter password" onfocusout="validate(this)">
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password:</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Enter confirm password" onfocusout="validate(this)">
            </div>

            <div class="d-flex gap-2 mb-4">
                <button type="submit" class="btn btn-primary">Sign Up</button>
                <!-- Added Update button to match the project mockup requirements -->
                <button type="button" class="btn btn-secondary" onclick="handleUpdateClick()">Update</button>
            </div>
        </form>

        <!-- Added JSON Container display area -->
        <div id="jsonDisplayContainer" style="max-width: 500px; display: none;" class="mt-4">
            <h5>Generated JSON Object:</h5>
            <pre id="jsonOutput"></pre>
        </div>
    </main>

    <aside>
        <h3>Hours</h3>
        <p>Open daily 10 AM - 6 PM</p>
    </aside>

    <footer>
        <p>&copy; 2026 Timeless Pages Bookstore</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function validate(obj) {
            let value = obj.value.trim();
            let isValid = true;

            if (value === "") {
                isValid = false;
            }
            else if (obj.id === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
                isValid = false;
            }
            else if (obj.id === "confirmPassword" && value !== document.getElementById("password").value) {
                isValid = false;
            }

            if (!isValid) {
                obj.style.color = "#FF0000";
                obj.style.borderColor = "#FF0000";
            } else {
                obj.style.color = "";
                obj.style.borderColor = "";
            }

            return isValid;
        }

        function validateForm() {
            let inputs = document.querySelectorAll("input");
            let formValid = true;

            inputs.forEach(input => {
                if (!validate(input)) {
                    formValid = false;
                }
            });

            return formValid;
        }

        // New function to collect fields, bundle into JSON, and show them on the page
        function displayFieldsAsJSON() {
            const signupData = {
                username: document.getElementById("username").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
                confirmPassword: document.getElementById("confirmPassword").value
            };

            const jsonOutput = document.getElementById("jsonOutput");
            const jsonDisplayContainer = document.getElementById("jsonDisplayContainer");

            jsonOutput.textContent = JSON.stringify(signupData, null, 4);
            jsonDisplayContainer.style.display = "block";
        }

        // Handles the standard form submission workflow safely
        function handleFormSubmit(event) {
            event.preventDefault(); // Stop page refresh
            
            if (validateForm()) {
                displayFieldsAsJSON();
            }
        }

        // Handles the 'Update' button click path
        function handleUpdateClick() {
            if (validateForm()) {
                displayFieldsAsJSON();
            }
        }
    </script>

</body>
</html>
