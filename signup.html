<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Signup - Timeless Pages Bookstore</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Existing CSS File -->
    <link rel="stylesheet" href="styles.css">

    <style>
        .notice {
            color: darkred;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Shared Storefront Header -->
    <header>
        <h1>Timeless Pages Bookstore</h1>
        <p class="notice">Sale: All books $10 today!</p>
    </header>

    <!-- Shared Storefront Navigation Bar -->
    <nav>
        <a href="index.html">Home</a> | <a href="index.html">Books</a> | <a href="signup.html">Sign Up</a>
    </nav>

    <!-- Main Body Content Area: Bootstrap Signup Form -->
    <main class="container my-4">
        <h2 class="mb-4">User Signup</h2>
        
        <form style="max-width: 500px;">
            <div class="mb-3">
                <label for="username" class="form-label">Username:</label>
                <input type="text" class="form-control" id="username" placeholder="Enter username" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" placeholder="Enter email" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password:</label>
                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password:</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Enter confirm password" required>
            </div>

            <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>
    </main>

    <!-- Shared Storefront Sidebar Info -->
    <aside>
        <h3>Hours</h3>
        <p>Open daily 10 AM - 6 PM</p>
    </aside>

    <!-- Shared Storefront Footer -->
    <footer>
        <p>&copy; 2026 Timeless Pages Bookstore</p>
    </footer>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
